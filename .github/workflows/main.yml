name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Bước này sẽ tự cài đặt Android SDK Tools, TỰ ĐỘNG đồng ý các license 
      # và TỰ ĐỘNG cấu hình lệnh sdkmanager vào PATH hệ thống toàn cục.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Gọi TRỰC TIẾP lệnh sdkmanager (Không dùng đường dẫn tuyệt đối)
      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # Tạo file local.properties chứa đường dẫn SDK để tránh lỗi Gradle "SDK location not found"
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopeeFoodDriver-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
