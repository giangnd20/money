name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ] # Tự động chạy khi bạn push lên nhánh main hoặc master
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bạn bấm nút tự động build thủ công trên giao diện GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Thiết lập Java JDK 17
      uses: actions/actions-setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Cấp quyền thực thi cho gradlew
      run: chmod +x gradlew
      working-directory: ShopeeFoodDriver # Trỏ vào đúng thư mục chứa dự án của bạn

    - name: Build Debug APK với Gradle
      run: ./gradlew assembleDebug
      working-directory: ShopeeFoodDriver

    - name: Lưu trữ và Tải lên file APK kết quả
      uses: actions/upload-artifact@v4
      with:
        name: shopeefood-driver-debug-apk
        path: ShopeeFoodDriver/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
